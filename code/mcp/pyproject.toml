[project]
name = "mcp-irctc"
version = "0.1.0"
description = "MCP server that exposes IRCTC capabilities (train status, PNR, train mapping) as tools and resources; calls the dummy IRCTC API."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "mcp>=1.0.0",
]

[project.scripts]
mcp-irctc = "server:main"
